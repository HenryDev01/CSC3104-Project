# Common app env (mounted into our Python containers)
x-app-env: &app_env
  CSV_PATH: ./app_data/DATA.csv
  DATA_DIR: ./app_data
  MODELS_DIR: ./models
  KAFKA_BOOTSTRAP: kafka:9092
  TOPIC_INFER_REQUESTS: ai.infer.requests
  TOPIC_RISK_CLASSIFICATIONS: ai.risk.classifications


# Provide a default SITE_ID so compose doesn’t warn when parsing
x-site-env: &site_env
  <<: *app_env
  SITE_ID: "0"


services:
  frontend:
    container_name: frontend
    image: frontend
    build:
      context: ./frontend
    ports:
      - "3000:80"
    volumes:
      - ./frontend:/app:cached
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    networks:
      - healthcare-net

  auth-service:
    container_name: auth-service
    image: auth-service
    build: ./backend/src/auth-service
    ports:
      - "5001:5001"
      - "50051:50051"
    volumes:
      - ./backend/src/auth-service:/app
    networks:
      - healthcare-net
    depends_on:
      database:
        condition: service_healthy
    environment:
      - DB_HOST=database
      - DB_PORT=3306
      - DB_USER=user
      - DB_PASSWORD=pass123
      - DB_NAME=Project

  list-patient-service:
    container_name: list-patient-service
    image: list-patient-service
    build: ./backend/src/list-patient-service
    ports:
      - "50052:50052"
    volumes:
      - ./backend/src/list-patient-service:/app
    networks:
      - healthcare-net
    depends_on:
      database:
        condition: service_healthy
    environment:
      - DB_HOST=database
      - DB_PORT=3306
      - DB_USER=user
      - DB_PASSWORD=pass123
      - DB_NAME=Project


  patient-detail-service:
    container_name: patient-detail-service
    image: patient-detail-service
    build: ./backend/src/patient-detail-service
    ports:
      - "50053:50053"
    volumes:
      - ./backend/src/patient-detail-service:/app
    networks:
      - healthcare-net
    depends_on:
      database:
        condition: service_healthy
    environment:
      - DB_HOST=database
      - DB_PORT=3306
      - DB_USER=user
      - DB_PASSWORD=pass123
      - DB_NAME=Project


  risk-app-service:
    container_name: risk-app-service
    image: risk-app-service
    build: ./backend/src/risk-app-service
    ports:
      - "50054:50054"
    volumes:
      - ./backend/src/risk-app-service:/app
    networks:
      - healthcare-net
    depends_on:
      database:
        condition: service_healthy
      kafka:
        condition: service_healthy


  scheduler-service:
    container_name: scheduler-service
    image: scheduler-service
    build: ./backend/src/scheduler-service
    ports:
      - "5005:5005"
    volumes:
      - ./backend/src/scheduler-service:/app
    networks:
      - healthcare-net
    depends_on:
      database:
        condition: service_healthy


  envoy-service:
    container_name: envoy
    image: envoy-service
    build: ./Envoy
    ports:
      - "9901:9901"
      - "10000:10000"
    volumes:
      - ./Envoy/envoy.yaml:/etc/envoy/envoy.yaml
    networks:
      - healthcare-net
    depends_on:
      - auth-service

  database:
    build: ./Database
    image: mariadb
    container_name: mariadb
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: Project
      MYSQL_USER: user
      MYSQL_PASSWORD: pass123
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./Database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - healthcare-net
    healthcheck:
      test: ["CMD", "mariadb", "-uroot", "-proot123", "-e", "SELECT 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s


  # Single-broker Kafka in KRaft mode (Confluent 7.6.1)
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: kafka
    environment:
      # KRaft identity (must be a valid ID from kafka-storage random-uuid)
      CLUSTER_ID: "N5fzApPQRmm8qgGrwmw-dA"
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"

      # KRaft single-node
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_NODE_ID: "1"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"

      # Listeners (internal for containers, host for Windows tools)
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"

      # Single-node replication factors
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports:
      - "29092:29092"
    healthcheck:
      test: [ "CMD", "bash", "-lc", "cub kafka-ready -b kafka:9092 1 20 || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      data_prep:
        condition: service_completed_successfully
    networks:
      - healthcare-net

  # One-off container to create topics after Kafka is healthy
  create-topics:
    image: confluentinc/cp-kafka:7.6.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: [ "bash","-lc","kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic ai.infer.requests --partitions 3 --replication-factor 1 && kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic ai.risk.classifications --partitions 3 --replication-factor 1 && kafka-topics --bootstrap-server kafka:9092 --list && echo 'Topics ready'" ]
    restart: "no"
    networks:
      - healthcare-net

  # Build the Python app image once; other services reference it
  app-image:
    build:
      context: ./backend/src/risk-classification-service
      dockerfile: Dockerfile
    image: federated-app:py311
    networks:
      - healthcare-net

  # One-off data prep job (writes npz shards + preprocess)
  data_prep:
    image: federated-app:py311
    environment: *app_env
    working_dir: /app
    volumes:
      - ./backend/src/risk-classification-service:/app
      - ./app_data:/app/app_data
      - ./models:/app/models
    command: bash -lc "python data_prep.py"
    restart: no
    networks:
      - healthcare-net


  # Flower server
  flower-server:
    image: federated-app:py311
    depends_on:
      data_prep:
        condition: service_completed_successfully
      kafka:
        condition: service_started
    environment: *app_env
    working_dir: /app
    volumes:
      - ./backend/src/risk-classification-service:/app
      - ./app_data:/app/app_data
      - ./models:/app/models
    ports:
      - "8080:8080"
    command: bash -lc "python server_flower.py"
    networks:
      - healthcare-net


  flower-client-0:
    image: federated-app:py311
    depends_on:
      flower-server:
        condition: service_started
    environment:
      SERVER_ADDRESS: "flower-server:8080"
      CSV_PATH: ./app_data/DATA.csv
      DATA_DIR: ./app_data
      MODELS_DIR: ./models
      KAFKA_BOOTSTRAP: kafka:9092
      TOPIC_INFER_REQUESTS: ai.infer.requests
      TOPIC_RISK_CLASSIFICATIONS: ai.risk.classifications
      SITE_ID: "0"
    working_dir: /app
    volumes:
      - ../backend/src/risk-classification-service:/app
      - ./app_data:/app/app_data
      - ./models:/app/models
    command: bash -lc "python client_flower.py --site_id $$SITE_ID"
    networks:
      - healthcare-net

  flower-client-1:
    image: federated-app:py311
    depends_on:
      flower-server:
        condition: service_started
    environment:
      SERVER_ADDRESS: "flower-server:8080"
      CSV_PATH: ./app_data/DATA.csv
      DATA_DIR: ./app_data
      MODELS_DIR: ./models
      KAFKA_BOOTSTRAP: kafka:9092
      TOPIC_INFER_REQUESTS: ai.infer.requests
      TOPIC_RISK_CLASSIFICATIONS: ai.risk.classifications
      SITE_ID: "1"
    working_dir: /app
    volumes:
      - ./backend/src/risk-classification-service:/app
      - ./app_data:/app/app_data
      - ./models:/app/models
    command: bash -lc "python client_flower.py --site_id $$SITE_ID"
    networks:
      - healthcare-net


  flower-client-2:
    image: federated-app:py311
    depends_on:
      flower-server:
        condition: service_started
    environment:
      SERVER_ADDRESS: "flower-server:8080"
      CSV_PATH: ./app_data/DATA.csv
      DATA_DIR: ./app_data
      MODELS_DIR: ./models
      KAFKA_BOOTSTRAP: kafka:9092
      TOPIC_INFER_REQUESTS: ai.infer.requests
      TOPIC_RISK_CLASSIFICATIONS: ai.risk.classifications
      SITE_ID: "2"
    working_dir: /app
    volumes:
      - ./backend/src/risk-classification-service:/app
      - ./app_data:/app/app_data
      - ./models:/app/models
    command: bash -lc "python client_flower.py --site_id $$SITE_ID"
    networks:
      - healthcare-net


  flower-client-3:
    image: federated-app:py311
    depends_on:
      flower-server:
        condition: service_started
    environment:
      SERVER_ADDRESS: "flower-server:8080"
      CSV_PATH: ./app_data/DATA.csv
      DATA_DIR: ./app_data
      MODELS_DIR: ./models
      KAFKA_BOOTSTRAP: kafka:9092
      TOPIC_INFER_REQUESTS: ai.infer.requests
      TOPIC_RISK_CLASSIFICATIONS: ai.risk.classifications
      SITE_ID: "3"
    working_dir: /app
    volumes:
      - ./backend/src/risk-classification-service:/app
      - ./app_data:/app/app_data
      - ./models:/app/models
    command: bash -lc "python client_flower.py --site_id $$SITE_ID"
    networks:
      - healthcare-net

  # Kafka-backed inference service
  infer:
    image: federated-app:py311
    depends_on:
      kafka:
        condition: service_healthy
      flower-server:
        condition: service_started
    environment: *app_env
    working_dir: /app
    volumes:
      - ./backend/src/risk-classification-service:/app
      - ./app_data:/app/app_data
      - ./models:/app/models
    command: bash -lc "python infer_kafka_service.py"
    networks:
      - healthcare-net

volumes:
  mariadb_data:

networks:
  healthcare-net:
    driver: bridge
