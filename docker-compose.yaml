services:
  frontend:
    container_name: frontend
    image: frontend
    build:
      context: ./frontend
    ports:
      - "3000:80"
    volumes:
      - ./frontend:/app:cached
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    networks:
      - healthcare-net

  auth-service:
    container_name: auth-service
    image: auth-service
    build: ./backend/src/auth-service
    ports:
      - "5001:5001"
      - "50051:50051"
    volumes:
      - ./backend/src/auth-service:/app
    networks:
      - healthcare-net
    depends_on:
      database:
        condition: service_healthy
    environment:
      - DB_HOST=database
      - DB_PORT=3306
      - DB_USER=user
      - DB_PASSWORD=pass123
      - DB_NAME=Project

  list-patient-service:
    container_name: list-patient-service
    image: list-patient-service
    build: ./backend/src/list-patient-service
    ports:
      - "5002:5002"
    volumes:
      - ./backend/src/list-patient-service:/app
    networks:
      - healthcare-net
    depends_on:
      database:
        condition: service_healthy


  patient-detail-service:
    container_name: patient-detail-service
    image: patient-detail-service
    build: ./backend/src/patient-detail-service
    ports:
      - "5003:5003"
    volumes:
      - ./backend/src/patient-detail-service:/app
    networks:
      - healthcare-net
    depends_on:
      database:
        condition: service_healthy

  risk-classification-service:
    container_name: risk-classification-service
    image: risk-classification-service
    build: ./backend/src/risk-classification-service
    ports:
      - "5004:5004"
    volumes:
      - ./backend/src/risk-classification-service:/app
    networks:
      - healthcare-net
    depends_on:
      database:
        condition: service_healthy

  scheduler-service:
    container_name: scheduler-service
    image: scheduler-service
    build: ./backend/src/scheduler-service
    ports:
      - "5005:5005"
    volumes:
      - ./backend/src/scheduler-service:/app
    networks:
      - healthcare-net
    depends_on:
      database:
        condition: service_healthy

  envoy-service:
    container_name: envoy
    image: envoy-service
    build: ./Envoy
    ports:
      - "9901:9901"
      - "10000:10000"
    volumes:
      - ./Envoy/envoy.yaml:/etc/envoy/envoy.yaml
    networks:
      - healthcare-net
    depends_on:
      - auth-service

  database:
    build: ./Database
    image: mariadb
    container_name: mariadb
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: Project
      MYSQL_USER: user
      MYSQL_PASSWORD: pass123
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./Database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - healthcare-net
    healthcheck:
      test: ["CMD", "mariadb", "-uroot", "-proot123", "-e", "SELECT 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s

volumes:
  mariadb_data:


networks:
  healthcare-net:
    driver: bridge
