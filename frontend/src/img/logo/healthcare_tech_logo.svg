<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Gradient Definitions -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00C9FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0066FF;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00FFB3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00C9A7;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Outer Circle (Tech Ring) -->
  <circle cx="100" cy="100" r="85" fill="none" stroke="url(#grad1)" stroke-width="3" opacity="0.3"/>
  
  <!-- Circuit Pattern -->
  <path d="M 100 30 L 100 45 M 85 100 L 70 100 M 100 170 L 100 155 M 130 100 L 145 100" 
        stroke="url(#grad1)" stroke-width="2" opacity="0.5"/>
  <circle cx="100" cy="45" r="3" fill="url(#grad1)"/>
  <circle cx="70" cy="100" r="3" fill="url(#grad1)"/>
  <circle cx="100" cy="155" r="3" fill="url(#grad1)"/>
  <circle cx="145" cy="100" r="3" fill="url(#grad1)"/>
  
  <!-- Medical Cross with Modern Touch -->
  <g transform="translate(100, 100)">
    <!-- Vertical bar -->
    <rect x="-12" y="-40" width="24" height="80" rx="4" fill="url(#grad2)"/>
    <!-- Horizontal bar -->
    <rect x="-40" y="-12" width="80" height="24" rx="4" fill="url(#grad2)"/>
    
    <!-- Tech accent corners -->
    <rect x="-35" y="-35" width="10" height="2" fill="url(#grad1)" opacity="0.8"/>
    <rect x="-35" y="-35" width="2" height="10" fill="url(#grad1)" opacity="0.8"/>
    
    <rect x="25" y="-35" width="10" height="2" fill="url(#grad1)" opacity="0.8"/>
    <rect x="33" y="-35" width="2" height="10" fill="url(#grad1)" opacity="0.8"/>
    
    <rect x="-35" y="33" width="10" height="2" fill="url(#grad1)" opacity="0.8"/>
    <rect x="-35" y="25" width="2" height="10" fill="url(#grad1)" opacity="0.8"/>
    
    <rect x="25" y="33" width="10" height="2" fill="url(#grad1)" opacity="0.8"/>
    <rect x="33" y="25" width="2" height="10" fill="url(#grad1)" opacity="0.8"/>
  </g>
  
  <!-- Pulse Line Effect -->
  <path d="M 30 130 L 50 130 L 60 115 L 70 145 L 80 130 L 100 130" 
        stroke="url(#grad2)" stroke-width="2.5" fill="none" opacity="0.6"/>
  <path d="M 100 70 L 120 70 L 130 55 L 140 85 L 150 70 L 170 70" 
        stroke="url(#grad2)" stroke-width="2.5" fill="none" opacity="0.6"/>
</svg>