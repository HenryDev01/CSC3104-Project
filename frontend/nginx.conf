server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # This is the key part for SPA routing
    location / {
        try_files $uri /index.html;
    }

    location /static/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public";
    }
}
